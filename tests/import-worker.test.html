<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Import worker tests</title>
</head>
<body>
  <h1>Import worker tests</h1>
  <pre id="results"></pre>
  <script src="../lib/jszip.js"></script>
  <script src="../lib/togeojson.js"></script>
  <script src="../js/shapefile-writer.js"></script>
  <script src="../js/import-core.js"></script>
  <script>
    'use strict';
    const results = [];
    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }
    async function test(name, run) {
      try {
        await run();
        results.push({ name, passed: true });
      } catch (error) {
        results.push({ name, passed: false, error: error.message });
      }
      document.getElementById('results').textContent = results.map(result =>
        `${result.passed ? 'PASS' : 'FAIL'} ${result.name}${result.error ? ': ' + result.error : ''}`).join('\n');
    }
    const point = (properties = {}) => ({ type: 'Feature', properties, geometry: { type: 'Point', coordinates: [149, -35] } });
    const jsonFile = (data, name = 'points.geojson') => new File([JSON.stringify(data)], name);
    const collection = features => ({ type: 'FeatureCollection', features });
    const pause = () => new Promise(resolve => setTimeout(resolve, 40));
    const kml = '<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Styled line</name><Style id="red"><LineStyle><color>ff0000ff</color><width>3</width></LineStyle></Style><Placemark><name>Road</name><styleUrl>#red</styleUrl><LineString><coordinates>149,-35 150,-34</coordinates></LineString></Placemark></Document></kml>';

    function runJob(job, onFeatures) {
      return new Promise((resolve, reject) => {
        const worker = new Worker('../js/import-worker.js?protocol=2');
        const output = { layers: [], batches: [], warnings: [], kmlConversions: 0 };
        let current = null;
        const finish = error => {
          clearTimeout(timer);
          worker.terminate();
          if (error) reject(error);
          else resolve(output);
        };
        const timer = setTimeout(() => finish(new Error('Worker timed out')), 15000);
        worker.onerror = event => finish(new Error(event.message));
        worker.onmessage = async event => {
          try {
            const data = event.data;
            let value;
            if (data.type === 'ready') { worker.postMessage({ ...job, type: 'import' }); return; }
            if (data.type === 'error') { finish(new Error(data.message)); return; }
            if (data.type === 'done') { finish(); return; }
            if (data.type === 'progress') return;
            if (data.type === 'warning') { output.warnings.push(data); return; }
            if (data.type === 'layer') {
              current = { ...data, features: [] };
              output.layers.push(current);
            } else if (data.type === 'features') {
              current.features.push(...data.features);
              output.batches.push(data.features.length);
              if (onFeatures) await onFeatures(output);
            } else if (data.type === 'kml') {
              output.kmlConversions++;
              const dom = new DOMParser().parseFromString(data.text, 'text/xml');
              if (dom.querySelector('parsererror')) throw new Error('Invalid KML');
              value = { collection: ImportCore.fromKml(dom, toGeoJSON), name: dom.querySelector('Document > name')?.textContent || data.name };
            }
            worker.postMessage({ type: 'ack', value });
          } catch (error) { finish(error); }
        };
      });
    }

    async function zipFile(name, entries) {
      const zip = new JSZip();
      entries.forEach(entry => zip.file(entry.name, entry.data));
      return new File([await zip.generateAsync({ type: 'arraybuffer' })], name);
    }

    const groupedKml = '<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Grouped labels</name><Style id="label"><IconStyle><scale>0</scale></IconStyle><LabelStyle><color>800000ff</color><scale>1.5</scale></LabelStyle></Style><Style id="none"><LabelStyle><scale>0</scale></LabelStyle></Style><Folder><name>Zones</name><Placemark><name>Footprint</name><Polygon><outerBoundaryIs><LinearRing><coordinates>148,-36 150,-36 150,-34 148,-34 148,-36</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark><Folder><name>Labels</name><Placemark><name>B</name><styleUrl>#label</styleUrl><Point><coordinates>149,-35</coordinates></Point></Placemark><Placemark><name>1</name><MultiGeometry><Point><coordinates>149.5,-35</coordinates></Point><Point><coordinates>149.7,-35</coordinates></Point></MultiGeometry></Placemark></Folder></Folder><Folder><name>Labels</name><visibility>0</visibility><Placemark><name>F</name><Point><coordinates>149,-34.5</coordinates></Point></Placemark></Folder><Folder><name>Empty</name></Folder><Placemark><name>E</name><styleUrl>#none</styleUrl><Point><coordinates>149,-35.5</coordinates></Point></Placemark><Placemark><name>A</name><Polygon><outerBoundaryIs><LinearRing><coordinates>150,-36 151,-36 151,-35 150,-35 150,-36</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark></Document></kml>';

    async function withEditor(run, viewport) {
      const frame = document.createElement('iframe');
      frame.title = 'Import regression editor';
      frame.style.cssText = 'width:100%;height:600px;border:0';
      if (viewport) {
        frame.style.width = `${viewport.width}px`;
        frame.style.height = `${viewport.height}px`;
      }
      const databaseName = `geoeditor-regression-${crypto.randomUUID()}`;
      const response = await fetch('../index.html');
      assert(response.ok, 'Could not load editor HTML');
      const html = await response.text();
      const bootstrap = `<base href="${new URL('../', location.href).href}"><script>
        (() => {
          let implementation;
          Object.defineProperty(window, 'SessionStore', {
            configurable: true,
            get: () => implementation,
            set: Store => { implementation = class extends Store { constructor(name = '${databaseName}') { super(name); } }; },
          });
        })();
      <\/script>`;
      const loaded = new Promise((resolve, reject) => {
        frame.onload = resolve;
        frame.onerror = () => reject(new Error('Could not load editor'));
      });
      frame.srcdoc = html.replace('<head>', `<head>${bootstrap}`);
      document.body.appendChild(frame);
      try {
        await loaded;
        assert(frame.contentWindow.__geoEditor, 'Editor did not initialize');
        await frame.contentWindow.__geoEditor.sessionReady;
        await new Promise(resolve => frame.contentWindow.setTimeout(resolve, 350));
        const map = frame.contentWindow.__geoEditor.map;
        const fitBounds = map.fitBounds;
        map.fitBounds = function(bounds, options) {
          return fitBounds.call(this, bounds, { ...options, animate: false });
        };
        await run(frame.contentWindow, frame.contentDocument);
      } finally {
        const app = frame.contentWindow.__geoEditor;
        if (app) {
          app.state.layers.forEach(layer => app.map.removeLayer(layer.group));
          app.state.layers.length = 0;
        }
        frame.remove();
        indexedDB.deleteDatabase(databaseName);
      }
    }

    (async () => {
      await test('Processing workers preserve mask, export and table results and terminate after each job', () => withEditor(async host => {
        const NativeWorker = host.Worker;
        const tasks = [];
        let terminated = 0;
        host.Worker = class extends NativeWorker {
          constructor(url, options) {
            super(url, options);
            tasks.push(new URL(url).searchParams.get('task'));
          }
          terminate() { terminated++; return super.terminate(); }
        };
        const fallback = () => { throw new Error('Expected real background execution'); };
        try {
          const features = [point({ name: 'A & B', count: 2 }), { ...point({ name: 'Outside', count: 1 }), geometry: { type: 'Point', coordinates: [160, -35] } }];
          const polygon = { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [[[148, -36], [150, -36], [150, -34], [148, -34], [148, -36]]] } };
          for (const exclude of [false, true]) {
            const result = await host.BackgroundTasks.run('mask', { features, polygons: [polygon], exclude }, { fallback });
            const mask = host.LayerMask.combine([polygon]);
            const expected = features.map(feature => host.LayerMask.clip(feature, mask, exclude)).filter(Boolean);
            assert(JSON.stringify(result) === JSON.stringify(expected), 'Mask worker differs from fallback');
          }
          const layer = { name: 'Worker exports', features, fields: ['name', 'count'], types: { name: 'string', count: 'number' }, color: '#123456' };
          for (const format of ['geojson', 'csv', 'kml', 'kmz', 'shp']) {
            const job = { layer, format, base: 'worker-output', options: { fields: layer.fields, categoryField: 'name', includeStyle: true, legendSort: null } };
            const result = await host.BackgroundTasks.run('export', job, { fallback });
            const expected = await host.ExportCore.generate(job);
            assert(result.files.map(file => file.name).join() === expected.files.map(file => file.name).join(), `Export worker filenames differ for ${format}`);
            for (let index = 0; index < result.files.length; index++) {
              const actualData = result.files[index].data;
              const expectedData = expected.files[index].data;
              if (format === 'kmz') {
                const actualZip = await host.JSZip.loadAsync(actualData);
                const expectedZip = await host.JSZip.loadAsync(expectedData);
                assert(await actualZip.file('doc.kml').async('string') === await expectedZip.file('doc.kml').async('string'), 'KMZ contents differ');
              } else {
                assert(typeof actualData === 'string' ? actualData === expectedData : actualData.length === expectedData.length && actualData.every((value, offset) => value === expectedData[offset]), `Export worker contents differ for ${result.files[index].name}`);
              }
            }
            assert(JSON.stringify(result.warnings) === JSON.stringify(expected.warnings), 'Export warnings differ');
          }
          const archive = await host.BackgroundTasks.run('export', { operation: 'zip', files: [{ name: 'test.txt', data: 'worker archive' }] }, { fallback });
          assert(await (await host.JSZip.loadAsync(archive)).file('test.txt').async('string') === 'worker archive', 'Background archive contents differ');
          const table = {
            rows: [{ index: 0, properties: { name: 'Site 10', count: null }, folderIds: ['visible'] }, { index: 1, properties: { name: 'Site 2', count: 3 }, folderIds: ['visible'] }, { index: 2, properties: { name: 'Site 1', count: 1 }, folderIds: ['hidden'] }],
            fields: ['name', 'count'], types: { name: 'string', count: 'number' }, filter: 'SITE', sort: { field: 'name', direction: 'asc' },
            folders: [{ id: 'visible', visible: true }, { id: 'hidden', visible: false }],
          };
          const indices = await host.BackgroundTasks.run('table', table, { fallback });
          assert(indices.join() === '1,0' && indices.join() === host.TableCore.query(table).join(), 'Worker filter, natural sort or folder visibility differs');
          table.sort = { field: 'count', direction: 'desc' };
          table.folders.forEach(folder => { folder.visible = false; });
          assert((await host.BackgroundTasks.run('table', table, { fallback })).join() === '1,2,0', 'Numeric ordering or empty values differ');
          assert(tasks.includes('mask') && tasks.includes('export') && tasks.includes('table'), 'Missing a worker task type');
          assert(terminated === tasks.length, 'Completed jobs left workers running');
        } finally { host.Worker = NativeWorker; }
      }));
      await test('Worker-backed downloads preserve formats, edited QGIS symbols and archive filenames', () => withEditor(async (host, doc) => {
        const app = host.__geoEditor;
        await app.handleFiles([jsonFile(collection([point({ name: 'A, "B"', count: 7 })]), 'worker-export.geojson')]);
        const layer = app.state.active;
        const downloads = [];
        const originalUrl = host.URL.createObjectURL;
        const originalClick = host.HTMLAnchorElement.prototype.click;
        const originalGenerate = host.ExportCore.generate;
        const originalPack = host.ExportCore.pack;
        host.URL.createObjectURL = blob => { downloads.push({ blob }); return 'blob:worker-export-test'; };
        host.HTMLAnchorElement.prototype.click = function() { downloads.at(-1).name = this.download; };
        host.ExportCore.generate = host.ExportCore.pack = () => { throw new Error('Export unexpectedly used the main thread'); };
        try {
          for (const format of ['geojson', 'csv', 'kml', 'kmz']) {
            doc.getElementById('fmt').value = format;
            await app.downloadLayers([layer]);
            const download = downloads.at(-1);
            assert(download.name === `worker-export.${format}`, `Wrong download filename for ${format}`);
            if (format === 'geojson') assert(JSON.parse(await download.blob.text()).features[0].properties.count === 7, 'GeoJSON download lost attributes');
            if (format === 'csv') assert((await download.blob.text()).includes('"A, ""B""",7'), 'CSV download lost quoting');
            if (format === 'kml') assert(new host.DOMParser().parseFromString(await download.blob.text(), 'text/xml').querySelector('Placemark > name').textContent === 'A, "B"', 'KML download lost escaped attributes');
            if (format === 'kmz') assert((await host.JSZip.loadAsync(await download.blob.arrayBuffer())).file('doc.kml'), 'KMZ download lost doc.kml');
          }
          doc.getElementById('fmt').value = 'shp';
          const pending = app.downloadLayers([layer]);
          for (let attempt = 0; attempt < 100 && !doc.getElementById('shapefileExportDlg').open; attempt++) await new Promise(resolve => host.setTimeout(resolve, 20));
          assert(doc.getElementById('shapefileExportDlg').open, 'Shapefile options did not open');
          const category = doc.getElementById('shapefileCategoryField');
          category.value = String(layer.fields.indexOf('name'));
          category.dispatchEvent(new host.Event('change'));
          const color = doc.querySelector('#shapefileStyleEditor input[type="color"]');
          assert(color, 'Missing symbol colour editor');
          color.value = '#123456';
          color.dispatchEvent(new host.Event('input', { bubbles: true }));
          color.dispatchEvent(new host.Event('change', { bubbles: true }));
          doc.getElementById('shapefileExportSubmit').click();
          doc.getAnimations().forEach(animation => animation.finish());
          await pending;
          const archive = await host.JSZip.loadAsync(await downloads.at(-1).blob.arrayBuffer());
          assert(downloads.at(-1).name === 'worker-export.zip' && archive.file('worker-export.shp') && archive.file('worker-export.dbf'), 'Shapefile download lost binary files');
          const qml = await archive.file('worker-export.qml').async('string');
          assert(qml.includes('18,52,86,255') && host.QgisStyle.read(qml).entries[0].category.getAttribute('value') === 'A, "B"', 'Worker export lost edited symbols or category values');
          doc.getElementById('fmt').value = 'geojson';
          await app.downloadLayers([layer, layer]);
          const multiple = await host.JSZip.loadAsync(await downloads.at(-1).blob.arrayBuffer());
          assert(multiple.file('worker-export.geojson') && multiple.file('worker-export_2.geojson'), 'Worker archive lost unique filenames');
          assert(layer.group.getLayers()[0].feature.properties.count === 7, 'Export changed source attributes');
        } finally {
          host.URL.createObjectURL = originalUrl;
          host.HTMLAnchorElement.prototype.click = originalClick;
          host.ExportCore.generate = originalGenerate;
          host.ExportCore.pack = originalPack;
        }
      }));
      await test('Background tasks fall back when blocked and clean up cancellation and worker errors', () => withEditor(async host => {
        const NativeWorker = host.Worker;
        let fallbackCalls = 0;
        const fallback = () => { fallbackCalls++; return 'local'; };
        try {
          host.Worker = undefined;
          assert(await host.BackgroundTasks.run('table', {}, { fallback }) === 'local', 'Missing Worker did not use fallback');
          host.Worker = class { constructor() { throw new Error('Worker blocked'); } };
          assert(await host.BackgroundTasks.run('export', {}, { fallback }) === 'local', 'Blocked Worker did not use fallback');
          let terminated = 0;
          host.Worker = class {
            constructor() { host.queueMicrotask(() => this.onerror({ preventDefault() {}, message: 'Startup failed' })); }
            terminate() { terminated++; }
          };
          assert(await host.BackgroundTasks.run('mask', {}, { fallback }) === 'local' && terminated === 1, 'Startup error leaked a worker or skipped fallback');
          host.Worker = class {
            constructor() { host.queueMicrotask(() => this.onmessage({ data: { type: 'ready' } })); }
            postMessage() { host.queueMicrotask(() => this.onmessage({ data: { type: 'error', message: 'Task failed' } })); }
            terminate() { terminated++; }
          };
          let rejected = false;
          try { await host.BackgroundTasks.run('export', {}, { fallback }); }
          catch (error) { rejected = error.message === 'Task failed'; }
          assert(rejected && terminated === 2, 'Task error was swallowed or leaked a worker');
          host.Worker = NativeWorker;
          const controller = new host.AbortController();
          const pending = host.BackgroundTasks.run('mask', {}, { signal: controller.signal, fallback });
          controller.abort();
          let aborted = false;
          try { await pending; } catch (error) { aborted = error.name === 'AbortError'; }
          assert(aborted && fallbackCalls === 3, 'Cancellation returned data or invoked fallback');
        } finally { host.Worker = NativeWorker; }
      }));
      await test('Large table workers cancel stale filters, preserve sorting and cannot overwrite a new active layer', () => withEditor(async (host, doc) => {
        const app = host.__geoEditor;
        await app.handleFiles([jsonFile(collection(Array.from({ length: 2500 }, (_, index) => point({ name: index % 2 ? 'other' : 'keep', rank: index }))), 'worker-table.geojson')]);
        const originalLayer = app.state.active;
        const NativeWorker = host.Worker;
        const originalQuery = host.TableCore.query;
        let created = 0;
        let terminated = 0;
        let active = 0;
        let peak = 0;
        host.Worker = class extends NativeWorker {
          constructor(url, options) {
            super(url, options);
            if (new URL(url).searchParams.get('task') === 'table') {
              this.tableTask = true;
              created++;
              peak = Math.max(peak, ++active);
            }
          }
          terminate() {
            if (this.tableTask) { terminated++; active--; }
            return super.terminate();
          }
        };
        host.TableCore.query = () => { throw new Error('Large query ran on the main thread'); };
        const filter = text => {
          doc.getElementById('filter').value = text;
          doc.getElementById('filter').dispatchEvent(new host.Event('input', { bubbles: true }));
        };
        const settled = async () => {
          for (let attempt = 0; attempt < 500 && doc.getElementById('tableWrap').hasAttribute('aria-busy'); attempt++) await new Promise(resolve => host.setTimeout(resolve, 20));
          assert(!doc.getElementById('tableWrap').hasAttribute('aria-busy'), 'Table worker did not settle');
        };
        try {
          filter('other');
          filter('keep');
          await settled();
          assert(doc.getElementById('tableCount').textContent.startsWith('1250 of 2500'), 'Stale filter result replaced the newest result');
          assert(doc.querySelector('tbody input').value === 'keep', 'Wrong filtered row rendered');
          doc.querySelectorAll('button.sort')[1].click();
          await settled();
          assert(doc.querySelector('tbody tr')._leaf.feature.properties.rank === 0, 'Worker ascending sort differs');
          doc.querySelectorAll('button.sort')[1].click();
          await settled();
          assert(doc.querySelector('tbody tr')._leaf.feature.properties.rank === 2498, 'Worker descending sort differs');
          assert(originalLayer.group.getLayers().length === 2500, 'Filtering changed source features');
          host.TableCore.query = originalQuery;
          const small = app.createLayer({ name: 'Small active layer', fields: ['name'], types: { name: 'string' }, features: [point({ name: 'small' })] });
          filter('other');
          small.group.getLayers()[0].fire('click', { latlng: host.L.latLng(-35, 149) });
          await settled();
          await new Promise(resolve => host.setTimeout(resolve, 150));
          assert(app.state.active === small && doc.getElementById('tableTitle').textContent === small.name, 'Stale table result overwrote a new layer');
          assert(created >= 5 && peak === 1 && active === 0 && terminated === created, 'Table queries overlapped or leaked workers');
        } finally {
          host.TableCore.query = originalQuery;
          host.Worker = NativeWorker;
        }
      }));
      await test('GeoJSON preparation retains types, normalizes values and splits geometries', async () => {
        const input = collection([
          { ...point({ id: 1, flag: true, nested: { ok: true } }), kml: { unrelated: true } },
          { type: 'Feature', properties: { id: 2 }, geometry: { type: 'MultiPoint', coordinates: [[149, -35], [150, -34]] } },
          { type: 'Feature', properties: {}, geometry: null },
        ]);
        input.kmlFolders = 'unrelated GeoJSON metadata';
        const expected = ImportCore.prepare(input, 'geojson');
        const output = await runJob({ file: jsonFile(input) });
        const layer = output.layers[0];
        assert(JSON.stringify(layer.features) === JSON.stringify(expected.features), 'Worker and fallback features differ');
        assert(JSON.stringify(layer.metadata.types) === JSON.stringify(expected.types), 'Worker and fallback types differ');
        assert(!layer.features[0].kml && layer.metadata.kmlFolders.length === 0, 'Foreign GeoJSON metadata treated as KML');
        assert(layer.metadata.count === 3 && layer.metadata.skipped === 1 && layer.metadata.split > 0, 'Preparation notes changed');
      });
      await test('Feature and raw geometry inputs are accepted', async () => {
        for (const data of [point({ id: 1 }), point().geometry]) {
          const output = await runJob({ file: jsonFile(data) });
          assert(output.layers[0].features.length === 1, 'Single geometry lost');
        }
      });
      await test('Feature transfers are bounded and wait for acknowledgment', async () => {
        const input = collection(Array.from({ length: 2101 }, (_, index) => point({ index })));
        const output = await runJob({ file: jsonFile(input) }, async output => {
          if (output.batches.length === 1) {
            await pause();
            assert(output.batches.length === 1, 'Worker sent another batch before acknowledgment');
          }
        });
        assert(output.batches.join() === '1000,1000,101', 'Unexpected batch sizes');
        assert(output.layers[0].features.at(-1).properties.index === 2100, 'Order changed');
      });
      await test('KML conversion stays in the worker and keeps document name and styles', async () => {
        const output = await runJob({ file: new File([kml], 'styled.kml') });
        const layer = output.layers[0];
        assert(output.kmlConversions === 0 && layer.name === 'Styled line', 'KML conversion left the worker or lost its name');
        assert(layer.features[0].style.stroke === '#ff0000', 'KML colour lost');
        assert(!layer.metadata.fields.includes('stroke'), 'Style leaked into attribute fields');
      });
      await test('KML and archived KML imports retain conversion results when workers cannot start', () => withEditor(async (host, doc) => {
        const Worker = host.Worker;
        let attempts = 0;
        host.Worker = class {
          constructor() { attempts++; throw new Error('Blocked import worker'); }
        };
        try {
          await host.__geoEditor.handleFiles([
            new File([groupedKml], 'fallback.kml'),
            await zipFile('fallback.kmz', [{ name: 'doc.kml', data: groupedKml }]),
            await zipFile('fallback.zip', [{ name: 'nested/map.kml', data: groupedKml }]),
          ]);
          const layers = host.__geoEditor.state.layers;
          assert(attempts === 1 && layers.length === 3, 'Worker startup failure lost a fallback conversion result');
          layers.forEach(layer => {
            assert(layer.name === 'Grouped labels' && layer.featureCount === 7, 'Fallback lost the document name or geometry');
            assert(layer.kmlFolders.length === 4 && layer.kmlFolders[2].visible === false, 'Fallback lost folder metadata');
            assert(layer.fields.includes('name') && layer.types.name === 'string', 'Fallback lost prepared attributes');
            const label = layer.group.getLayers().find(leaf => leaf.feature.properties.name === 'B');
            assert(label.feature.style['label-color'] === '#ff0000', 'Fallback lost KML label styling');
          });
          assert(doc.getElementById('importProgress').hidden, 'Fallback import did not finish');
        } finally { host.Worker = Worker; }
      }));
      await test('Incompatible cached import workers are terminated before receiving files', () => withEditor(async host => {
        const Worker = host.Worker;
        let terminated = 0;
        let posted = 0;
        host.Worker = class {
          constructor(url) {
            assert(new URL(url).searchParams.get('protocol') === '2', 'Import worker URL does not distinguish protocol versions');
            host.setTimeout(() => this.onmessage?.({ data: { type: 'ready' } }), 0);
          }
          postMessage() { posted++; }
          terminate() { terminated++; }
        };
        try {
          await host.__geoEditor.handleFiles([new File([groupedKml], 'cached-worker.kml')]);
          const layer = host.__geoEditor.state.layers[0];
          assert(terminated === 1 && posted === 0, 'An incompatible worker received a file or was not terminated');
          assert(layer?.featureCount === 7 && layer.kmlFolders.length === 4, 'Incompatible worker did not fall back to local KML conversion');
        } finally { host.Worker = Worker; }
      }));
      await test('Nested, duplicate and empty KML folders survive worker preparation', async () => {
        const output = await runJob({ file: new File([groupedKml], 'grouped.kml') });
        const layer = output.layers[0];
        const folders = layer.metadata.kmlFolders;
        assert(folders.length === 4 && folders[1].parentId === folders[0].id, 'Hierarchy lost');
        assert(folders[1].name === folders[2].name && folders[1].id !== folders[2].id, 'Duplicate names merged');
        assert(folders[2].visible === false && folders[3].name === 'Empty', 'Hidden or empty folder lost');
        const numbers = layer.features.filter(feature => feature.properties.name === '1');
        assert(numbers.length === 2 && numbers.every(feature => feature.kml.folderIds.join() === [folders[0].id, folders[1].id].join()), 'Split features lost folder membership');
        assert(!layer.metadata.fields.includes('kml'), 'Folder metadata leaked into attributes');
      });
      await test('Large KML folder trees populate collapsed branches only when expanded', () => withEditor(async (host, doc) => {
        const branches = Array.from({ length: 80 }, (_, branch) => `<Folder><name>Group ${branch}</name>${
          Array.from({ length: 80 }, (_, child) => `<Folder><name>Child ${child}</name>${branch === 0 && child === 0

          host.SpatialQueries.release('fallback');

          host.Worker = NativeWorker;
          host.SpatialQueries.release('fixture'); host.SpatialQueries.release('released'); host.SpatialQueries.release('fallback');
          host.setTimeout = setTimer;
          host.clearTimeout = clearTimer;

          const dialog = doc.getElementById('sessionProgressDlg');
          assert(dialog.open && !doc.getElementById('sessionProgressBar').hasAttribute('value') && dialog.querySelector('.progress-track').classList.contains('indeterminate'), 'Unknown session duration is not shown as indeterminate');
          const cancelEvent = new host.Event('cancel', { cancelable: true });
          dialog.dispatchEvent(cancelEvent);
          assert(cancelEvent.defaultPrevented && dialog.open && !dialog.classList.contains('closing') && !dialog.querySelector('button[value="cancel"], button[value="close"], .progress-cancel'), 'Busy session progress became dismissible');
          await check(dialog);
          finishSave();
          await waitFor(() => !dialog.open && !doc.getElementById('btnSession').disabled);
          assert(dialog.returnValue === 'ok' && !dialog.classList.contains('closing'), 'Completed session progress did not close normally');
          assert(await new host.SessionStore().load(), 'Session save failed after shared progress');
        } finally { host.SessionStore.prototype.save = originalSave; }
      }));
      await test('New layer uploads show progress even for small fast files', () => withEditor(async (host, doc) => {
        const progress = doc.getElementById('importProgress');
        const input = doc.getElementById('fileInput');
        const transfer = new host.DataTransfer();
        const file = jsonFile(collection([point()]), 'small-upload.geojson');
        transfer.items.add(file);
        assert(file.size < 1024 * 1024, 'Regression file is not small');
        let picked = false;
        let visible = false;
        const observer = new host.MutationObserver(() => {
          if (!progress.hidden && doc.getElementById('mapWrap').getAttribute('aria-busy') === 'true') visible = true;
        });
        observer.observe(progress, { attributes: true, attributeFilter: ['hidden'] });
        const originalClick = input.click;
        input.click = () => {
          picked = true;
          input.files = transfer.files;
          input.dispatchEvent(new host.Event('change', { bubbles: true }));
        };
        try {
          doc.getElementById('btnNewLayer').click();
          doc.querySelector('#dlgBody input[value="upload"]').click();
          doc.getElementById('dlgOk').click();
          doc.getAnimations().forEach(animation => animation.finish());
          for (let attempt = 0; attempt < 500; attempt++) {
            if (picked && host.__geoEditor.state.layers.length && progress.hidden) break;
            await new Promise(resolve => host.setTimeout(resolve, 20));
          }
          assert(picked, 'New layer did not open the upload picker');
          assert(visible, 'Small upload never showed progress');
          const layer = host.__geoEditor.state.layers[0];
          assert(layer && !layer.importing && layer.group.getLayers().length === 1, 'Small upload did not finish');
          assert(progress.hidden && !doc.getElementById('mapWrap').hasAttribute('aria-busy'), 'Progress did not close after upload');
        } finally {
          input.click = originalClick;
          observer.disconnect();
        }
      }));
      await test('Imports disable cancellation during synchronous steps and restore it after errors', () => withEditor(async (host, doc) => {
        const app = host.__geoEditor;
        const button = doc.getElementById('btnCancelImport');
        const prepare = host.ImportCore.prepare;
        const reinit = host.L.PM.reInitLayer;
        const fire = host.L.FeatureGroup.prototype.fire;
        const parse = host.DOMParser.prototype.parseFromString;
        let preparations = 0;
        let finalizations = 0;
        let construction = 0;
        let kmlParses = 0;
        let clicks = 0;
        const countClick = () => { clicks++; };
        button.addEventListener('click', countClick);
        const checkDisabled = () => {
          assert(button.disabled && button.title.includes('unavailable'), 'Synchronous import work left Cancel enabled');
          const style = host.getComputedStyle(button);
          assert(style.opacity === '0.4' && style.cursor === 'not-allowed', 'Unavailable Cancel does not look disabled');
          button.click();
        };
        host.ImportCore.prepare = function(data, format) {
          preparations++;
          checkDisabled();
          if (data.features[0].properties.fail) throw new Error('Deliberate preparation failure');
          return prepare.call(this, data, format);
        };
        host.DOMParser.prototype.parseFromString = function(text, type) {
          if (type === 'text/xml' && !doc.getElementById('importProgress').hidden) {
            kmlParses++;
            checkDisabled();
          }
          return parse.call(this, text, type);
        };
        host.L.PM.reInitLayer = function(layer) {
          if (app.state.layers.some(item => item.group === layer)) {
            finalizations++;
            checkDisabled();
          }
          return reinit.call(this, layer);
        };
        host.L.FeatureGroup.prototype.fire = function(type, ...args) {
          if (type === 'layeradd' && app.state.layers.some(item => item.group === this)) {
            construction++;
            assert(!button.disabled && button.title === 'Cancel import', 'Cancel was not restored during interruptible construction');
          }
          return fire.call(this, type, ...args);
        };
        try {
          await app.handleFiles([
            jsonFile(collection([point({ fail: true })]), 'failed-preparation.geojson'),
            jsonFile(collection([point({ name: 'Recovered' })]), 'recovered-preparation.geojson'),
            await zipFile('disabled-worker.kmz', [{ name: 'doc.kml', data: kml }]),
          ]);
          assert(preparations === 2 && finalizations === 2 && construction === 2 && kmlParses === 0, 'Import did not keep KML parsing in the worker and disable local synchronous stages');
          assert(clicks === 0 && app.state.layers.length === 2 && app.state.layers[0].name === 'recovered-preparation', 'Disabled Cancel dispatched a click or recovery failed');
          assert(doc.getElementById('importProgress').hidden, 'Progress remained visible after recovery');
        } finally {
          host.ImportCore.prepare = prepare;
          host.L.PM.reInitLayer = reinit;
          host.DOMParser.prototype.parseFromString = parse;
          if (fire === host.L.Evented.prototype.fire) delete host.L.FeatureGroup.prototype.fire;
          else host.L.FeatureGroup.prototype.fire = fire;
          button.removeEventListener('click', countClick);
        }
      }));
      await test('Imports defer full display scans until construction finishes', () => withEditor(async host => {
        const app = host.__geoEditor;
        const original = host.L.GeoJSON.prototype.getLayers;
        let intermediateScans = 0;
        host.L.GeoJSON.prototype.getLayers = function() {
          if (app.state.layers.some(layer => layer.group === this && layer.importing)) intermediateScans++;
          return original.call(this);
        };
        try {
          await app.handleFiles([jsonFile(collection(Array.from({ length: 3000 }, (_, id) => point({ id }))), 'deferred-sampling.geojson')]);
          const layer = app.state.layers[0];
          assert(layer && !layer.importing && layer.group.getLayers().length === 3000, 'Import did not finalize all features');
          assert(intermediateScans === 0, 'Growing layer was repeatedly scanned during import');
          assert(layer.group.pm && layer.group.pm.getLayers().length === 3000, 'Import did not restore group editing for every feature');
          assert(layer.displayed.size > 0 && layer.displayed.size <= 20000, 'Final display was not refreshed');
        } finally { host.L.GeoJSON.prototype.getLayers = original; }
      }));
      await test('Cancelling a time-sliced import preserves completed files and the next queued import', () => withEditor(async (host, doc) => {
        const app = host.__geoEditor;
        const original = host.L.FeatureGroup.prototype.fire;
        let requested = false;
        let constructed = 0;
        let pointerTarget = false;
        host.L.FeatureGroup.prototype.fire = function(type, ...args) {
          if (type === 'layeradd' && app.state.layers.some(layer => layer.group === this && layer.name === 'cancel-performance')) {
            constructed++;
            const started = host.performance.now();
            while (host.performance.now() - started < 2) {}
            if (!requested) {
              requested = true;
              host.setTimeout(() => {
                const button = doc.getElementById('btnCancelImport');
                const bounds = button.getBoundingClientRect();
                pointerTarget = doc.elementFromPoint(bounds.x + bounds.width / 2, bounds.y + bounds.height / 2)?.closest('button') === button;
                button.click();
              }, 0);
            }
          }
          return original.call(this, type, ...args);
        };
        try {
          const pending = app.handleFiles([
            jsonFile(collection([point()]), 'completed-performance.geojson'),
            jsonFile(collection(Array.from({ length: 5000 }, (_, id) => point({ id }))), 'cancel-performance.geojson'),
          ]);
          const queued = app.handleFiles([jsonFile(collection([point()]), 'queued-performance.geojson')]);
          await pending;
          await queued;
          assert(requested, 'Test never reached partial layer construction');
          assert(constructed <= 20, `Cancel waited for ${constructed} expensive features before the browser could respond`);
          assert(pointerTarget, 'Cancel import was not reachable by a pointer');
          assert(app.state.layers.map(layer => layer.name).join() === 'completed-performance,queued-performance', 'Cancellation removed completed data or kept the partial file');
          assert(app.state.layers.every(layer => !layer.importing), 'Import state did not recover');
          assert(doc.getElementById('importProgress').hidden, 'Progress remained open');
        } finally {
          if (original === host.L.Evented.prototype.fire) delete host.L.FeatureGroup.prototype.fire;
          else host.L.FeatureGroup.prototype.fire = original;
        }
      }));
      await test('KMZ and KML ZIP archives decompress in the worker', async () => {
        for (const name of ['styled.kmz', 'styled.zip']) {
          const file = await zipFile(name, [{ name: 'nested/doc.kml', data: kml }]);
          const output = await runJob({ file });
          assert(output.layers[0].features.length === 1 && output.kmlConversions === 0, 'Archive import did not convert KML fully in the worker');
        }
      });
      const parts = ShapefileWriter.writeShapefiles('parts', [point({ name: 'Canberra', count: 7 })], ['name', 'count'], { name: 'string', count: 'number' }).files;
      await test('Shapefile ZIP parsing keeps coordinates and DBF attributes', async () => {
        const output = await runJob({ file: await zipFile('parts.zip', parts) });
        const layer = output.layers[0];
        assert(layer.metadata.geomType === 'Point', 'Shapefile geometry type changed');
        assert(layer.features[0].properties.name === 'Canberra' && layer.features[0].properties.count === 7, 'DBF attributes changed');
        assert(layer.features[0].geometry.coordinates.join() === '149,-35', 'Coordinates changed');
      });
      await test('Loose shapefile components are packed and read in the worker', async () => {
        const output = await runJob({ files: parts.map(part => new File([part.data], part.name)) });
        assert(output.layers[0].name === 'parts' && output.layers[0].features.length === 1, 'Loose parts failed');
      });
      await test('Multiple shapefiles in one ZIP retain separate layer names', async () => {
        const other = ShapefileWriter.writeShapefiles('other', [point({})], [], {}).files;
        const output = await runJob({ file: await zipFile('multiple.zip', [...parts, ...other]) });
        assert(output.layers.map(layer => layer.name).sort().join() === 'other,parts', 'Layer collections merged or renamed');
      });
      await test('Empty and out-of-range geometries create no layers and report warnings', async () => {
        for (const features of [[], [{ ...point(), geometry: { type: 'Point', coordinates: [300, -35] } }]]) {
          const output = await runJob({ file: jsonFile(collection(features)) });
          assert(output.layers.length === 0 && output.warnings.length === 1, 'Invalid collection accepted silently');
        }
      });
      await test('Malformed JSON and unsupported archives surface errors', async () => {
        for (const file of [new File(['{invalid'], 'bad.json'), new File(['<kml><Document><name>Broken</Document></kml>'], 'bad.kml'), await zipFile('empty.zip', [])]) {
          let rejected = false;
          try { await runJob({ file }); } catch { rejected = true; }
          assert(rejected, 'Invalid input accepted');
        }
      });
      window.importWorkerTestResults = results;
      window.importWorkerTestDone = true;
    })();
  </script>
